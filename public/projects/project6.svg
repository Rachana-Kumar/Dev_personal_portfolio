<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1410"/>
      <stop offset="1" stop-color="#3a1f12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left text -->
  <text x="70" y="150" font-family="Georgia, serif" font-size="26" fill="#ffc247" letter-spacing="4">AI-POWERED ORDERING APP</text>
  <text x="70" y="240" font-family="Georgia, serif" font-size="82" font-weight="bold" fill="#fff7ee">Intelligent</text>
  <text x="70" y="330" font-family="Georgia, serif" font-size="82" font-weight="bold" fill="url(#accent)">Bistro</text>
  <text x="70" y="390" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e8d5c4">Order with natural language. A conversational</text>
  <text x="70" y="425" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#e8d5c4">assistant manages your cart for you.</text>

  <!-- Tech chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#fff7ee">
    <rect x="70" y="470" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ff8a3d" stroke-opacity="0.6"/>
    <text x="145" y="496" text-anchor="middle">React Native</text>
    <rect x="232" y="470" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ff8a3d" stroke-opacity="0.6"/>
    <text x="287" y="496" text-anchor="middle">Node.js</text>
    <rect x="354" y="470" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ff8a3d" stroke-opacity="0.6"/>
    <text x="429" y="496" text-anchor="middle">Groq Llama 3.3</text>
    <rect x="516" y="470" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.12" stroke="#ff8a3d" stroke-opacity="0.6"/>
    <text x="576" y="496" text-anchor="middle">TypeScript</text>
  </g>

  <g transform="translate(-10,45) scale(0.9)">
<!-- Phone 1: Menu -->
  <g transform="translate(700,110) rotate(-6 80 200)">
    <rect width="170" height="350" rx="26" fill="#0f0a07" stroke="#5a3a26" stroke-width="3"/>
    <rect x="12" y="30" width="146" height="14" rx="7" fill="#ff8a3d"/>
    <g fill="#fff7ee" fill-opacity="0.12">
      <rect x="12" y="56" width="40" height="18" rx="9" fill="#ff8a3d"/>
      <rect x="58" y="56" width="40" height="18" rx="9"/>
      <rect x="104" y="56" width="40" height="18" rx="9"/>
    </g>
    <g>
      <rect x="12" y="88" width="146" height="58" rx="10" fill="#2a1a10"/>
      <circle cx="38" cy="116" r="14" fill="#ff8a3d"/>
      <rect x="62" y="102" width="70" height="8" rx="4" fill="#fff7ee" fill-opacity="0.8"/>
      <rect x="62" y="118" width="40" height="8" rx="4" fill="#ffc247"/>
      <rect x="12" y="154" width="146" height="58" rx="10" fill="#2a1a10"/>
      <circle cx="38" cy="182" r="14" fill="#e8452c"/>
      <rect x="62" y="168" width="80" height="8" rx="4" fill="#fff7ee" fill-opacity="0.8"/>
      <rect x="62" y="184" width="40" height="8" rx="4" fill="#ffc247"/>
      <rect x="12" y="220" width="146" height="58" rx="10" fill="#2a1a10"/>
      <circle cx="38" cy="248" r="14" fill="#ffc247"/>
      <rect x="62" y="234" width="60" height="8" rx="4" fill="#fff7ee" fill-opacity="0.8"/>
      <rect x="62" y="250" width="40" height="8" rx="4" fill="#ffc247"/>
    </g>
    <text x="85" y="324" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#e8d5c4">Menu</text>
  </g>

  <!-- Phone 2: AI Chat (center, larger) -->
  <g transform="translate(880,80)">
    <rect width="190" height="400" rx="28" fill="#0f0a07" stroke="url(#accent)" stroke-width="3.5"/>
    <text x="95" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffc247">Bistro AI</text>
    <rect x="22" y="58" width="156" height="62" rx="14" fill="url(#accent)"/>
    <text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1c1410" font-weight="bold">
      <tspan x="32" y="80">Add 2 spicy chicken</tspan>
      <tspan x="32" y="98">sandwiches + a lemonade</tspan>
    </text>
    <rect x="12" y="136" width="150" height="100" rx="14" fill="#2a1a10"/>
    <text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#fff7ee">
      <tspan x="22" y="158">Added to your cart!</tspan>
      <tspan x="22" y="180" fill="#ffc247">2× Spicy Chicken Sand.</tspan>
      <tspan x="22" y="198" fill="#ffc247">1× Fresh Lemonade</tspan>
      <tspan x="22" y="220" fill="#e8d5c4" font-size="11">Anything else?</tspan>
    </text>
    <g fill="#ffffff" fill-opacity="0.12" stroke="#ff8a3d" stroke-opacity="0.5">
      <rect x="12" y="256" width="80" height="24" rx="12"/>
      <rect x="98" y="256" width="80" height="24" rx="12"/>
    </g>
    <text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#e8d5c4" text-anchor="middle">
      <tspan x="52" y="272">Show cart</tspan><tspan x="138" y="272">Add dessert</tspan>
    </text>
    <rect x="12" y="350" width="166" height="34" rx="17" fill="#2a1a10" stroke="#5a3a26"/>
    <text x="28" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e8d5c4" fill-opacity="0.6">Type your order…</text>
    <circle cx="160" cy="367" r="12" fill="url(#accent)"/>
  </g>

  <!-- Phone 3: Cart -->
  <g transform="translate(1060,130) rotate(6 80 200)">
    <rect width="170" height="350" rx="26" fill="#0f0a07" stroke="#5a3a26" stroke-width="3"/>
    <text x="85" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffc247">Your Cart</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#fff7ee">
      <rect x="12" y="60" width="146" height="40" rx="8" fill="#2a1a10"/>
      <text x="22" y="85">2× Spicy Chicken</text><text x="148" y="85" text-anchor="end" fill="#ffc247">$35.98</text>
      <rect x="12" y="108" width="146" height="40" rx="8" fill="#2a1a10"/>
      <text x="22" y="133">1× Lemonade</text><text x="148" y="133" text-anchor="end" fill="#ffc247">$5.99</text>
      <text x="22" y="190" fill="#e8d5c4">Tax (8.75%)</text><text x="148" y="190" text-anchor="end" fill="#e8d5c4">$3.66</text>
      <text x="22" y="214" font-weight="bold" font-size="14">Total</text><text x="148" y="214" text-anchor="end" font-weight="bold" font-size="14" fill="#ffc247">$45.63</text>
    </g>
    <rect x="12" y="290" width="146" height="38" rx="19" fill="url(#accent)"/>
    <text x="85" y="314" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1c1410">Place Order</text>
  </g>
</g>
</svg>
